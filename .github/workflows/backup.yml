# Weekly D1 backup (SPEC issue 09): exports the production database and
# commits a dated SQL dump to this repo — surviving even account loss.
# D1 Time Travel (7-day point-in-time recovery) remains the short-horizon net;
# this workflow is the long-horizon one.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — API token with D1 read access
#   CLOUDFLARE_ACCOUNT_ID  — the account holding the skarbonka D1 database

name: Backup D1 database

on:
  schedule:
    # Mondays 04:17 UTC (≈05:17/06:17 Warsaw) — off the top of the hour to
    # avoid GitHub's busiest cron minutes.
    - cron: "17 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Export the D1 database
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p backups
          npx --yes wrangler@4 d1 export skarbonka --remote \
            --output "backups/skarbonka-$(date -u +%F).sql"

      - name: Commit the dump
        run: |
          git config user.name "skarbonka-backup-bot"
          git config user.email "actions@github.com"
          git add backups/
          if git diff --cached --quiet; then
            echo "No changes since last backup — nothing to commit."
          else
            git commit -m "chore: D1 backup $(date -u +%F)"
            git push
          fi
